  <script src="https://cdn.redocly.com/redoc/v2.5.4/bundles/redoc.standalone.js"></script>
  <script id="spec" type="application/json">{"openapi":"3.0.3","info":{"title":"XunoNext Dashboard API","version":"1.1.0","description":"Read-oriented, evidence-first API behind the XunoNext Dashboard: operational, financial,\ncompliance and reconciliation visibility across programs, accounts, transactions and users.\n\n## What changed in 1.1\n\n1.0 grew organically, and the same data ended up reachable through several different\nshapes. Alerts, for example, could be read three ways, and the two sub-resource forms\nsupported 2 filters each against the main collection's 18. 1.1 removes that split.\n\n**One collection per record type.** Anything an operator might query across parents is a\ntop-level collection with a parent filter. `GET /users/{id}/alerts` becomes\n`GET /alerts?userId=`, and inherits every filter, sort option and page control the main\ncollection has. A sub-path now survives only when the child genuinely cannot be addressed\noutside its parent, such as a balance series computed for one account.\n\n**One action endpoint per resource.** Thirteen verb-shaped endpoints\n(`/hold`, `/release`, `/cancel`, `/refund`, `/acknowledge`, `/resolve`, and so on) collapse\ninto six `POST .../actions` endpoints. The body is a discriminated union keyed on `action`,\nso each variant keeps its own required fields and validation.\n\n**One response shape.** Four envelopes cover the entire API, and `/auth/login` and\n`/health` no longer sit outside them.\n\n## Response envelopes\n\nEvery 2xx body is one of three shapes; every non-2xx is `ErrorResponse`. All four carry\n`meta` with `requestId`, `generatedAt` and `apiVersion`.\n\n| Shape | Used by | Distinguishing fields |\n|---|---|---|\n| `EntityEnvelope` | single-record reads | `entityId`, `entity` |\n| `CollectionEnvelope` | every list | `entities`, `pagination`, `filters`, `summary` |\n| `OperationEnvelope` | every write | `EntityEnvelope` plus `action`, `auditEventId`, `approvalRequired` |\n| `ErrorResponse` | every 4xx and 5xx | `code`, `reason`, `message`, `validationErrors` |\n\n`entityType` names the record type on every response, using the same singular snake_case\nvocabulary as `belongsTo` and the audit trail.\n\nThe only endpoint that does not return the envelope is\n`GET /compliance/documents/{documentId}/download`, where the body is the file itself.\nIts errors still use `ErrorResponse`.\n\n### Reading a collection response\n\n`entities` is one page. `pagination.totalCount` is the size of the whole filtered set.\n`summary` aggregates the **whole filtered set, not the page**, so a footer total does not\nchange as the operator pages. `filters` echoes every filter in effect, including defaults\nthe server applied, which is what filter chips should render from.\n\n## Query grammar\n\nThe same conventions hold on every collection, so a filter learned in one view transfers\nto the next.\n\n| Convention | Form | Example |\n|---|---|---|\n| Pagination | `page`, `pageSize` | `?page=2&pageSize=100` |\n| Sorting | `sortBy`, `sortOrder` | `?sortBy=valueDate&sortOrder=DESC` |\n| Text search | `search` | `?search=ACME` |\n| Multi-value | comma-separated or repeated | `?status=FAILED,PENDING` |\n| Date range | `<field>From` / `<field>To`, inclusive | `?valueDateFrom=2026-09-01` |\n| Numeric range | `<field>Min` / `<field>Max` | `?amountMin=1000` |\n| Sparse fields | `fields` | `?fields=transactionId,status,amount` |\n| Expansion | `include` | `?include=legs,fees` |\n| Aggregation | `groupBy` | `?groupBy=STATUS` |\n\nFilters combine with AND across parameters and OR within a multi-value parameter, so\n`?status=FAILED,PENDING&programId=PRG-1` means *(FAILED or PENDING) and program PRG-1*.\n\n`status` always refers to the primary status of the record being listed. Statuses borrowed\nfrom a related record are qualified: on `/transactions` you will find `status` alongside\n`legStatus`, `reconciliationStatus` and `complianceStatus`.\n\nUnknown parameters and unsortable `sortBy` values are rejected with `ERR_VALIDATION`\nrather than ignored, so a typo surfaces immediately instead of silently widening a result\nset an operator believes is filtered.\n\n## Errors\n\n`code` is the stable, branchable value. `reason` narrows it, `message` is for humans and\nmay be reworded without notice. `ERR_VALIDATION` carries `validationErrors` keyed by\nparameter name.\n\nAnything outside the caller's scope returns `404`, never `403`, so scope boundaries cannot\nbe probed. `403` means the resource is in scope but the action is not permitted.\n\n## Writes\n\nWrites accept `Idempotency-Key`. Replaying a key within 24 hours returns the original\nresponse with `idempotent: true` rather than repeating the effect.\n\nEvery write returns `auditEventId`, retrievable at `GET /audit-events/{auditEventId}`.\nWhen a program requires dual control, `approvalRequired` is `true` and `entity` reflects\nthe staged state, not the final one.\n\n## Deprecations\n\nv1.0 paths continue to serve until **2027-03-31**, answering with `Deprecation` and\n`Sunset` headers and a `meta.deprecations` entry naming the replacement. Nothing is\nremoved before that date.\n","contact":{"name":"XunoNext Engineering"},"license":{"name":"Proprietary \u2014 Xuno","url":"https://xuno.co/legal"}},"servers":[{"url":"https://sandbox.xunonext.xuno.co/api/v1/dashboard","description":"Sandbox"},{"url":"https://production.xunonext.xuno.co/api/v1/dashboard","description":"Production"}],"security":[{"BearerAuth":[]}],"tags":[{"name":"Authentication","description":"Token issue and scope introspection."},{"name":"Health","description":"Service and dependency state."},{"name":"Overview","description":"Portfolio KPIs and aggregated breakdowns."},{"name":"Programs","description":"Program configuration and performance."},{"name":"Organisations","description":"Clients, partners and providers."},{"name":"Accounts","description":"Accounts, sub-ledgers and balances."},{"name":"Ledger","description":"Entries, journals, trial balance and positions."},{"name":"Transactions","description":"Transactions, legs, timeline events and operator actions."},{"name":"Reconciliation","description":"Exceptions, checks, runs, statements and lines."},{"name":"Users","description":"Senders, recipients and the counterparty graph."},{"name":"Compliance","description":"KYC documents, screenings and review cases."},{"name":"Alerts","description":"Operational and risk alerts."},{"name":"Audit Trail","description":"Immutable action history."},{"name":"Treasury","description":"Liquidity, currency positions and funding."},{"name":"Economics","description":"Fees, margin and settlement."},{"name":"Reference Data","description":"Enumerations and stage models."}],"paths":{"/auth/login":{"post":{"operationId":"createAuthSession","tags":["Authentication"],"summary":"Exchange credentials for a bearer token","description":"Returns a short-lived bearer token plus the scope it carries. Every other endpoint is filtered by that scope; anything outside it returns `404`, never `403`, so scope boundaries are not probeable.","security":[],"parameters":[{"$ref":"#/components/parameters/RequestId"}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LoginRequest"}}}},"responses":{"200":{"description":"Authenticated.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["auth_session"]},"entity":{"$ref":"#/components/schemas/AuthSession"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/InvalidCredentials"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/auth/session":{"get":{"operationId":"getAuthSession","tags":["Authentication"],"summary":"Describe the current token's scope","description":"Resolves the calle ogramFilter"},{"$ref":"#/components/parameters/ClientFilter"},{"$ref":"#/components/parameters/PartnerFilter"},{"$ref":"#/components/parameters/CorridorFilter"},{"$ref":"#/components/parameters/CurrencyFilter"},{"$ref":"#/components/parameters/ValueDateFrom"},{"$ref":"#/components/parameters/ValueDateTo"},{"$ref":"#/components/parameters/AsOf"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Fields"}],"responses":{"200":{"description":"A single `overview` record.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["overview"]},"entity":{"$ref":"#/components/schemas/Overview"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/overview/breakdowns":{"get":{"operationId":"listOverviewBreakdowns","tags":["Overview"],"summary":"Overview aggregated by a dimension","description":"Replaces the v1.0 `/overview/program-breakdown` and `/overview/fund-positions` endpoints. Pick the dimension with `groupBy`; the filter set is identical whichever you choose.\n\n**Sortable fields:** `volume`, `count`, `revenue`, `openAlerts`, `label`.","parameters":[{"$ref":"#/components/parameters/BreakdownGroupByFilter"},{"$ref":"#/components/parameters/ProgramFilter"},{"$ref":"#/components/parameters/ClientFilter"},{"$ref":"#/components/parameters/PartnerFilter"},{"$ref":"#/components/parameters/CorridorFilter"},{"$ref":"#/components/parameters/CurrencyFilter"},{"$ref":"#/components/parameters/ValueDateFrom"},{"$ref":"#/components/parameters/ValueDateTo"},{"$ref":"#/components/parameters/AsOf"},{"$ref":"#/components/parameters/Search"},{"$ref":"#/components/parameters/Fields"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/PageSize"},{"$ref":"#/components/parameters/SortBy"},{"$ref":"#/components/parameters/SortOrder"}],"responses":{"200":{"description":"Paginated `overview_breakdown` records.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/CollectionEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["overview_breakdown"]},"entities":{"type":"array","items":{"$ref":"#/components/schemas/OverviewBreakdownRow"}}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/programs":{"get":{"operationId":"listPrograms","tags":["Programs"],"summary":"List programs","description":"Programs visible to the caller.\n\n**Sortable fields:** `name`, `createdAt`, `volume`, `count`.\n\n**`groupBy` values:** `CLIENT`, `PARTNER`, `CORRIDOR`, `STATUS`. Grouped totals are returned in `summary.groups`.","parameters":[{"$ref":"#/components/parameters/ProgramStatusFilter"},{"$ref":"#/components/parameters/ClientFilter"},{"$ref":"#/components/parameters/PartnerFilter"},{"$ref":"#/components/parameters/CorridorFilter"},{"$ref":"#/components/parameters/CurrencyFilter"},{"$ref":"#/components/parameters/ValueDateFrom"},{"$ref":"#/components/parameters/ValueDateTo"},{"$ref":"#/components/parameters/GroupBy"},{"$ref":"#/components/parameters/Search"},{"$ref":"#/components/parameters/Fields"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/PageSize"},{"$ref":"#/components/parameters/SortBy"},{"$ref":"#/compone ameters/ProgramId"},{"$ref":"#/components/parameters/ValueDateFrom"},{"$ref":"#/components/parameters/ValueDateTo"},{"$ref":"#/components/parameters/Granularity"},{"$ref":"#/components/parameters/Fields"}],"responses":{"200":{"description":"A single `program_performance` record.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["program_performance"]},"entity":{"$ref":"#/components/schemas/ProgramPerformance"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/organizations":{"get":{"operationId":"listOrganizations","tags":["Organisations"],"summary":"List organisations","description":"Clients, partners and providers in scope.\n\n**Sortable fields:** `name`, `createdAt`.\n\n**`groupBy` values:** `ROLE`, `COUNTRY`. Grouped totals are returned in `summary.groups`.","parameters":[{"$ref":"#/components/parameters/OrganizationRoleFilter"},{"$ref":"#/components/parameters/CountryFilter"},{"$ref":"#/components/parameters/ProgramFilter"},{"$ref":"#/components/parameters/GroupBy"},{"$ref":"#/components/parameters/Search"},{"$ref":"#/components/parameters/Fields"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/PageSize"},{"$ref":"#/components/parameters/SortBy"},{"$ref":"#/components/parameters/SortOrder"}],"responses":{"200":{"description":"Paginated `organization` records.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/CollectionEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["organization"]},"entities":{"type":"array","items":{"$ref":"#/components/schemas/Organization"}}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/organizations/{organizationId}":{"get":{"operationId":"getOrganization","tags":["Organisations"],"summary":"Get an organisation","description":"Full organisation record including contacts and program memberships.","parameters":[{"$ref":"#/components/parameters/OrganizationId"},{"$ref":"#/components/parameters/Fields"}],"responses":{"200":{"description":"A single `organization` record.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["organization"]},"entity":{"$ref":"#/components/schemas/OrganizationDetail"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/accounts":{"get":{"operationId":"listAccounts","tags":["Accounts"],"summary":"List accounts","description":"Every account view in one place. This replaces three v1.0 endpoints:\n\n- program accounts -> `?programId=`\n- a user's accounts -> `?holderId=`\n- an account's sub-ledgers -> `?parentAccountId=`\n\nAll three now support the full filter, sort and pagination set, which the sub-resource forms did not.\n\n**Sortable fields:** `createdAt`, `ledgerBalance`, `availableBalance`, `name`, `lastReconciledAt`.\n\n**`include` values:** `balances`, `institution`, `holder`.\n\n**`groupBy` values:** `PROGRAM`, `CURRENCY`, `TYPE`, `STATUS`, `INSTITUTION`. Grouped totals are returned in `summary.groups`.","parameters":[{"$ref":"#/components/parameters/AccountStatusFilter"},{"$ref":"#/components/parameters/AccountTypeFilter"},{"$ref":"#/components/parameters/AccountOwnershipFilter"},{"$ref":"#/components/parameters/ProgramFilter"},{"$ref":"#/components/parameters/ClientFilter"},{"$ref":"#/components/parameters/PartnerFilter"},{"$ref":"#/components/parameters/CurrencyFilter"},{"$ref":"#/components/parameters/HolderIdFilter"},{"$ref":"#/components/parameters/ParentAccountIdFilter"},{"$ref":"#/components/parameters/InstitutionIdFilter"},{"$ref":"#/components/parameters/ReconciliationStatusFilter"},{"$ref":"#/components/parameters/ReconciledBefore"},{"$ref":"#/components/parameters/ExternalReferenceIdFilter"},{"$ref":"#/components/parameters/GroupBy"},{"$ref":"#/components/parameters/Search"},{"$ref":"#/components/parameters/Fields"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Page"},{"$ref":"#/components/parameters/PageSize"},{"$ref":"#/components/parameters/SortBy"},{"$ref":"#/components/parameters/SortOrder"}],"responses":{"200":{"description":"Paginated `account` records.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/CollectionEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["account"]},"entities":{"type":"array","items":{"$ref":"#/components/schemas/AccountRow"}}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/accounts/{accountId}":{"get":{"operationId":"getAccount","tags":["Accounts"],"summary":"Get an account","description":"Full account record. Sensitive identifiers are masked; unmask them with `POST /accounts/{accountId}/actions`.\n\n**`include` values:** `balances`, `institution`, `holder`, `subLedgerCount`.","parameters":[{"$ref":"#/components/parameters/AccountId"},{"$ref":"#/components/parameters/Include"},{"$ref":"#/components/parameters/Fields"}],"responses":{"200":{"description":"A single `account` record.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["account"]},"entity":{"$ref":"#/components/schemas/AccountDetail"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/Forbidden"},"404":{"$ref":"#/components/responses/NotFound"},"429":{"$ref":"#/components/responses/RateLimited"},"500":{"$ref":"#/components/responses/InternalError"},"503":{"$ref":"#/components/responses/UpstreamUnavailable"}}}},"/accounts/{accountId}/balance-history":{"get":{"operationId":"getAccountBalanceHistory","tags":["Accounts"],"summary":"Account balance history","description":"Balance time series for one account. Stays a sub-resource: it is a computed series for a single account, not a set queryable across accounts.","parameters":[{"$ref":"#/components/parameters/AccountId"},{"$ref":"#/components/parameters/PostedFrom"},{"$ref":"#/components/parameters/PostedTo"},{"$ref":"#/components/parameters/Granularity"},{"$ref":"#/components/parameters/Fields"}],"responses":{"200":{"description":"A single `account_balance_history` record.","content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/EntityEnvelope"},{"type":"object","properties":{"entityType":{"type":"string","enum":["account_balance_history"]},"entity":{"$ref":"#/components/schemas/BalanceHistory"}}}]}}}},"400":{"$ref":"#/components/responses/BadRequest"},"401":{"$r
